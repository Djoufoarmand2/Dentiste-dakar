openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: site
    description: Public website content and administrator access
  - name: admin
    description: Private cabinet administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /site-content:
    get:
      operationId: getSiteContent
      tags: [site]
      summary: Get public website content
      responses:
        "200":
          description: Current website content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContent"
    put:
      operationId: updateSiteContent
      tags: [site]
      summary: Replace website content
      description: Administrator-only. Updates all editable website content in one operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteContentInput"
      responses:
        "200":
          description: Updated website content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContent"
        "400":
          description: Invalid website content
        "401":
          description: Sign-in required
        "403":
          description: Administrator access required
  /contact/appointment:
    post:
      operationId: submitContactAppointment
      tags: [site]
      summary: Persist a website appointment request privately
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactAppointmentInput"
      responses:
        "200":
          description: Appointment request saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactAppointmentAccepted"
        "400": { description: Invalid request }
        "403": { description: Origin not allowed }
        "429": { description: Submission rate exceeded }
        "503": { description: Storage unavailable }
  /contact/question:
    post:
      operationId: submitContactQuestion
      tags: [site]
      summary: Persist a public contact question privately
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactQuestionInput" }
      responses:
        "201":
          description: Contact question saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactQuestionAccepted" }
        "400": { description: Invalid request or missing channel consent }
        "403": { description: Origin not allowed }
        "429": { description: Submission rate exceeded }
        "503": { description: Storage unavailable }
  /contact/notification-status:
    post:
      operationId: updateContactNotificationStatus
      tags: [site]
      summary: Record a provider acceptance or failure for a saved request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactNotificationStatusInput" }
      responses:
        "204": { description: Notification status recorded }
        "400": { description: Invalid request or status token }
        "403": { description: Origin not allowed }
        "404": { description: Request not found }
  /admin/appointments:
    get:
      operationId: getAdminAppointments
      tags: [admin]
      responses:
        "200":
          description: Private appointment requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppointmentRequest" }
        "401": { description: Sign-in required }
        "403": { description: Administrator required }
  /admin/appointments/{id}:
    patch:
      operationId: updateAdminAppointment
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactRequestAdminUpdate" }
      responses:
        "200": { description: Appointment request updated }
        "400": { description: Invalid update }
        "401": { description: Sign-in required }
        "403": { description: Administrator required }
        "404": { description: Request not found }
    delete:
      operationId: deleteAdminAppointment
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Request deleted }
        "401": { description: Sign-in required }
        "403": { description: Administrator required }
  /admin/contact-questions:
    get:
      operationId: getAdminContactQuestions
      tags: [admin]
      responses:
        "200":
          description: Private contact questions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContactQuestion" }
        "401": { description: Sign-in required }
        "403": { description: Administrator required }
  /admin/contact-questions/{id}:
    patch:
      operationId: updateAdminContactQuestion
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactRequestAdminUpdate" }
      responses:
        "200": { description: Contact question updated }
        "400": { description: Invalid update }
        "401": { description: Sign-in required }
        "403": { description: Administrator required }
        "404": { description: Request not found }
    delete:
      operationId: deleteAdminContactQuestion
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Contact question deleted }
        "401": { description: Sign-in required }
        "403": { description: Administrator required }
  /admin/messaging-settings:
    get:
      operationId: getAdminMessagingSettings
      tags: [admin]
      responses:
        "200":
          description: Private notification channel settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagingSettings" }
        "401": { description: Sign-in required }
        "403": { description: Administrator required }
    put:
      operationId: updateAdminMessagingSettings
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessagingSettingsInput" }
      responses:
        "200":
          description: Notification channel settings saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagingSettings" }
        "400": { description: Invalid settings or channel not validated }
        "401": { description: Sign-in required }
        "403": { description: Administrator required }
  /admin/messaging-settings/validate-whatsapp:
    post:
      operationId: validateAdminWhatsAppSettings
      tags: [admin]
      responses:
        "200":
          description: WhatsApp number and approved template validation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagingValidationResponse" }
        "401": { description: Sign-in required }
        "403": { description: Administrator required }
        "503": { description: WhatsApp API configuration unavailable }
  /reviews:
    get:
      operationId: getPublicReviews
      tags: [site]
      summary: List published visitor and administrator reviews
      responses:
        "200":
          description: Published reviews
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Review" }
    post:
      operationId: submitReview
      tags: [site]
      summary: Submit a review for immediate public display
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewSubmission" }
      responses:
        "201":
          description: Review saved and published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "400": { description: Invalid review }
        "403": { description: Origin not allowed }
        "429": { description: Too many review submissions }
  /admin/reviews:
    get:
      operationId: getAdminReviews
      tags: [site]
      summary: List reviews for administrator management
      responses:
        "200":
          description: All reviews
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Review" }
        "401": { description: Sign-in required }
        "403": { description: Administrator access required }
    post:
      operationId: createAdminReview
      tags: [site]
      summary: Create a review as administrator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReviewInput" }
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "400": { description: Invalid review }
        "401": { description: Sign-in required }
        "403": { description: Administrator access required }
  /admin/reviews/{id}:
    delete:
      operationId: deleteAdminReview
      tags: [site]
      summary: Delete a review as administrator
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Review deleted }
        "400": { description: Invalid review ID }
        "401": { description: Sign-in required }
        "403": { description: Administrator access required }
        "404": { description: Review not found }
  /admin/access:
    get:
      operationId: getAdminAccess
      tags: [site]
      summary: Check current administrator access
      responses:
        "200":
          description: Access check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccess"
        "401":
          description: Sign-in required
  /admin/site-content:
    get:
      operationId: getAdminContent
      tags: [site]
      summary: Read complete content and publication version
      responses:
        "200":
          description: Administrator document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentDocument" }
        "401": { description: Sign-in required }
        "403": { description: Administrator required }
    put:
      operationId: publishAdminContent
      tags: [site]
      summary: Publish content with optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentPublication" }
      responses:
        "200":
          description: Published document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentDocument" }
        "409": { description: Concurrent publication or invalid media reference }
        "401": { description: Sign-in required }
        "403": { description: Administrator required }
  /admin/media:
    get:
      operationId: getAdminMedia
      tags: [site]
      summary: List cabinet media
      responses:
        "200":
          description: Media library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaLibrary" }
  /admin/media/prepare:
    post:
      operationId: prepareAdminMedia
      tags: [site]
      summary: Reserve a unique path before direct resumable upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaUploadInput" }
      responses:
        "201":
          description: Reserved media
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAsset" }
  /admin/media/finalize:
    post:
      operationId: finalizeAdminMedia
      tags: [site]
      summary: Verify an uploaded file before selection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaReference" }
      responses:
        "200":
          description: Verified media
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAsset" }
  /admin/media/delete:
    post:
      operationId: deleteAdminMedia
      tags: [site]
      summary: Delete media only when not referenced by content
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaReference" }
      responses:
        "204": { description: Media deleted }
        "409": { description: Media still referenced }
components:
  schemas:
    ContactAppointmentInput:
      type: object
      required: [name, phone, service]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, minLength: 1, maxLength: 40 }
        email: { type: string, format: email, maxLength: 254 }
        service:
          type: string
          enum:
            - Consultation dentaire
            - Détartrage et polissage
            - Traitement des caries
            - Plombage / composite
            - Kinésithérapie dentaire / maxillo-faciale
            - Laboratoire prothétique
            - Chirurgie dentaire
        preferredDate: { type: string, format: date }
        preferredWindow:
          type: string
          enum: [weekdays, saturday]
        contactChannel:
          type: string
          enum: [email, whatsapp, both]
          default: email
        whatsappConsent: { type: boolean, default: false }
        message: { type: string, maxLength: 2000 }
        website: { type: string, maxLength: 200 }
        submissionId: { type: string, format: uuid }
    ContactAppointmentAccepted:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
        requestId: { type: string, format: uuid }
        notificationSent: { type: boolean }
        statusToken: { type: string }
        emailStatus: { type: string, enum: [pending, accepted, failed, not_requested, not_configured] }
        whatsappStatus: { type: string, enum: [pending, accepted, failed, not_requested, not_configured] }
    AppointmentRequest:
      type: object
      required: [id, name, phone, service, createdAt, contactChannel, whatsappConsent, emailStatus, whatsappStatus, contactValidated, replyStatus]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        email: { type: ["string", "null"] }
        service: { type: string }
        preferredDate: { type: string, nullable: true }
        preferredWindow:
          type: ["string", "null"]
          enum: [weekdays, saturday, null]
        message: { type: string, nullable: true }
        contactChannel: { type: string, enum: [email, whatsapp, both] }
        whatsappConsent: { type: boolean }
        emailStatus: { type: string, enum: [pending, accepted, failed, not_requested, not_configured] }
        whatsappStatus: { type: string, enum: [pending, accepted, failed, not_requested, not_configured] }
        contactValidated: { type: boolean }
        replyStatus: { type: string, enum: [not_replied, draft_opened, replied] }
        createdAt: { type: string, format: date-time }
    ContactQuestionInput:
      type: object
      required: [submissionId, message, contactChannel]
      properties:
        submissionId: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 40 }
        message: { type: string, minLength: 5, maxLength: 2000 }
        contactChannel: { type: string, enum: [email, whatsapp, both] }
        whatsappConsent: { type: boolean, default: false }
        website: { type: string, maxLength: 200 }
    ContactQuestionAccepted:
      type: object
      required: [accepted, requestId, statusToken]
      properties:
        accepted: { type: boolean }
        requestId: { type: string, format: uuid }
        statusToken: { type: string }
        emailStatus: { type: string, enum: [pending, accepted, failed, not_requested, not_configured] }
        whatsappStatus: { type: string, enum: [pending, accepted, failed, not_requested, not_configured] }
    ContactQuestion:
      type: object
      required: [id, name, email, phone, message, contactChannel, whatsappConsent, emailStatus, whatsappStatus, contactValidated, replyStatus, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        message: { type: string }
        contactChannel: { type: string, enum: [email, whatsapp, both] }
        whatsappConsent: { type: boolean }
        emailStatus: { type: string, enum: [pending, accepted, failed, not_requested, not_configured] }
        whatsappStatus: { type: string, enum: [pending, accepted, failed, not_requested, not_configured] }
        contactValidated: { type: boolean }
        replyStatus: { type: string, enum: [not_replied, draft_opened, replied] }
        createdAt: { type: string, format: date-time }
    ContactNotificationStatusInput:
      type: object
      required: [requestId, requestType, statusToken, emailStatus]
      properties:
        requestId: { type: string, format: uuid }
        requestType: { type: string, enum: [appointment, question] }
        statusToken: { type: string, minLength: 32, maxLength: 128 }
        emailStatus: { type: string, enum: [accepted, failed] }
    ContactRequestAdminUpdate:
      type: object
      minProperties: 1
      properties:
        contactValidated: { type: boolean }
        replyStatus: { type: string, enum: [not_replied, draft_opened, replied] }
    MessagingSettings:
      type: object
      required: [emailAutoResponderActive, whatsappEnabled, whatsappPhoneNumberId, whatsappTemplateName, whatsappTemplateLanguage, whatsappValidated, whatsappCredentialsReady]
      properties:
        emailAutoResponderActive: { type: boolean }
        whatsappEnabled: { type: boolean }
        whatsappPhoneNumberId: { type: ["string", "null"] }
        whatsappTemplateName: { type: ["string", "null"] }
        whatsappTemplateLanguage: { type: string }
        whatsappValidated: { type: boolean }
        whatsappCredentialsReady: { type: boolean }
    MessagingSettingsInput:
      type: object
      required: [emailAutoResponderActive, whatsappEnabled, whatsappPhoneNumberId, whatsappTemplateName, whatsappTemplateLanguage]
      properties:
        emailAutoResponderActive: { type: boolean }
        whatsappEnabled: { type: boolean }
        whatsappPhoneNumberId: { type: ["string", "null"], maxLength: 100 }
        whatsappTemplateName: { type: ["string", "null"], maxLength: 120 }
        whatsappTemplateLanguage: { type: string, minLength: 2, maxLength: 20 }
    MessagingValidationResponse:
      type: object
      required: [valid, message]
      properties:
        valid: { type: boolean }
        message: { type: string }
    Review:
      type: object
      required: [id, name, service, quote, rating, createdAt, source]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
        service: { type: string, maxLength: 120 }
        quote: { type: string, maxLength: 1500 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        createdAt: { type: string, format: date-time }
        source: { type: string, enum: [visitor, admin] }
    ReviewSubmission:
      type: object
      required: [name, quote, rating, consent]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        service: { type: string, maxLength: 120 }
        quote: { type: string, minLength: 12, maxLength: 1500 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        consent: { type: boolean, enum: [true] }
        website: { type: string, maxLength: 200 }
    AdminReviewInput:
      type: object
      required: [name, quote, rating]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        service: { type: string, maxLength: 120 }
        quote: { type: string, minLength: 1, maxLength: 1500 }
        rating: { type: integer, minimum: 1, maximum: 5 }
    ContentDocument:
      type: object
      required: [content, version]
      properties:
        content: { $ref: "#/components/schemas/SiteContent" }
        version: { type: integer, minimum: 1 }
    ContentPublication:
      type: object
      required: [content, expectedVersion]
      properties:
        content: { $ref: "#/components/schemas/SiteContentInput" }
        expectedVersion: { type: integer, minimum: 1 }
    MediaReference:
      type: object
      required: [path]
      properties:
        path: { type: string, minLength: 1, maxLength: 200 }
    MediaUploadInput:
      type: object
      required: [name, mimeType, size]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/gif, video/mp4, video/webm]
        size: { type: integer, minimum: 1, maximum: 52428800 }
    MediaAsset:
      type: object
      required: [path, url, name, mimeType, size, status]
      properties:
        path: { type: string }
        url: { type: string }
        name: { type: string }
        mimeType: { type: string }
        size: { type: integer }
        status: { type: string, enum: [uploading, ready, deleting] }
    MediaLibrary:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MediaAsset" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AdminAccess:
      type: object
      properties:
        isAdmin:
          type: boolean
      required: [isAdmin]
    ClinicInfo:
      type: object
      properties:
        name: { type: string }
        city: { type: string }
        address: { type: string }
        phone: { type: string }
        email: { type: string }
        openingHours: { type: string }
        openingHoursEn: { type: string }
        bookingUrl: { type: string }
        mapUrl: { type: string }
        logoUrl: { type: string }
      required: [name, city, address, phone, email, openingHours, bookingUrl, mapUrl, logoUrl]
    HeroContent:
      type: object
      properties:
        eyebrow: { type: string }
        title: { type: string }
        description: { type: string }
        primaryAction: { type: string }
        secondaryAction: { type: string }
        imageUrl: { type: string }
        eyebrowEn: { type: string }
        titleEn: { type: string }
        descriptionEn: { type: string }
        primaryActionEn: { type: string }
        secondaryActionEn: { type: string }
      required: [eyebrow, title, description, primaryAction, secondaryAction, imageUrl]
    ServiceItem:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        slug: { type: string }
        summary: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        titleEn: { type: string }
        slugEn: { type: string }
        summaryEn: { type: string }
        descriptionEn: { type: string }
        purpose: { type: string }
        purposeEn: { type: string }
        procedureSteps: { type: string }
        procedureStepsEn: { type: string }
        imageAlt: { type: string }
        imageAltEn: { type: string }
      required: [id, title, slug, summary, description, imageUrl]
    TeamMember:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        biography: { type: string }
        imageUrl: { type: string }
        roleEn: { type: string }
        biographyEn: { type: string }
      required: [id, name, role, biography, imageUrl]
    GalleryImage:
      type: object
      properties:
        id: { type: string }
        alt: { type: string }
        imageUrl: { type: string }
        altEn: { type: string }
      required: [id, alt, imageUrl]
    Testimonial:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        service: { type: string }
        quote: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        serviceEn: { type: string }
        quoteEn: { type: string }
      required: [id, name, service, quote, rating]
    FAQItem:
      type: object
      properties:
        id: { type: string }
        question: { type: string }
        answer: { type: string }
        questionEn: { type: string }
        answerEn: { type: string }
      required: [id, question, answer]
    BlogPost:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        slug: { type: string }
        excerpt: { type: string }
        content: { type: string }
        imageUrl: { type: string }
        author: { type: string }
        date: { type: string }
        published: { type: boolean }
        titleEn: { type: string }
        slugEn: { type: string }
        excerptEn: { type: string }
        contentEn: { type: string }
        authorEn: { type: string }
        imageAlt: { type: string }
        imageAltEn: { type: string }
        relatedServiceSlugs: { type: string }
        relatedArticleSlugs: { type: string }
      required: [id, title, slug, excerpt, content, imageUrl, author, date, published]
    SocialLink:
      type: object
      properties:
        id: { type: string, minLength: 1 }
        platform: { type: string, enum: [facebook, instagram, tiktok, snapchat, youtube, linkedin, x, whatsapp, other] }
        label: { type: string, minLength: 1 }
        url: { type: string, minLength: 1 }
        logoUrl: { type: string }
        imageAlt: { type: string }
      required: [id, platform, label, url]
    Campaign:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        mediaType: { type: string, enum: [image, video] }
        imageUrl: { type: string }
        videoUrl: { type: ["string", "null"] }
        active: { type: boolean }
        titleEn: { type: string }
